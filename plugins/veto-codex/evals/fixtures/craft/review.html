<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Synthetic receiving review</title>
<style>body{font:16px system-ui;max-width:760px;margin:48px auto;padding:0 24px;color:#202524;background:#fafafa}h1{font-size:28px}label{display:block;margin-top:24px}input,button{font:inherit;padding:10px}button:focus-visible,input:focus-visible{outline:2px solid #245c50;outline-offset:3px}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.12em}.overline{font-weight:600}.source{border-top:1px solid #bbb;padding-top:20px}</style></head><body>

<h1>Review receiving instructions</h1>
<p id="review-status" role="status">Office review required</p>
<p class="orientation">Review the receiving instructions below.</p>
<label class="overline" for="account">Receiving account</label>
<input id="account" name="account" value="SYNTHETIC-0042" autocomplete="off">
<section class="source" aria-labelledby="source-title"><h2 id="source-title">Original source</h2><p>Compare the supplied instruction with the prepared details.</p></section>
<button type="button">Save office review</button><button type="button">Return a question</button>

</body></html>
