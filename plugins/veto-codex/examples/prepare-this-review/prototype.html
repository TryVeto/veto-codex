 if (state.cases.some(x => x.id === parts[0]) && ['review','file','activity','list','seller','service'].includes(parts[1]) && M.PEOPLE[parts[2]]) {
   ui.fileId=parts[0]; ui.view=parts[1]; ui.actor=parts[2];
   if (ui.actor==='seller') ui.view='seller';
 }
}
function badge(file) { const s=M.status(file); return '<span class="badge ' + s.tone + '">' + e(s.label) + '</span>'; }
function logo() { return '<img class="logo" src="' + window.VETO_LOGO + '" alt="Veto">'; }
function renderHeader() {
 const file=f(), pp=M.PEOPLE[ui.actor];
 return '<div class="demo-bar"><div class="row"><strong><span class="demo-dot"></span>Interactive prototype</strong><span class="demo-explanation">Fictional data. No live checks, messages, or payments.</span></div><button type="button" data-a="controls">Demo controls</button></div>' +
 '<header class="topbar"><button class="brand-btn" data-a="home" aria-label="Veto sample files">'+logo()+'</button><div class="separator"></div><span class="office-name">Harbor Escrow <span class="muted small">· example office</span></span>' +
 (ui.actor==='seller'?'':'<nav class="top-nav" aria-label="Main navigation"><button type="button" data-a="home" class="active">Files</button></nav>') +
 '<div class="persona"><span class="avatar">'+e(ui.actor==='seller'?file.seller.split(' ').map(x=>x[0]).join(''):pp.initials)+'</span><div><label class="persona-label" for="actor-select">Experience as</label><select id="actor-select" aria-label="Experience as">'+Object.entries(M.PEOPLE).map(([id,p])=>'<option value="'+id+'"'+(ui.actor===id?' selected':'')+'>'+e(id==='seller'?file.seller+' · Seller':p.short+' · '+(id==='jordan'?'Veto':id==='alex'?'Covering officer':'Escrow officer'))+'</option>').join('')+'</select></div></div></header>';
}
function renderFooter() {
 return '<footer class="bottom"><span class="storage-mode">'+icon(sessionOnly?'info':'lock')+e(sessionOnly?'Session-only demo · leave this page open':'Demo progress is saved in this browser')+'</span><span class="footer-scope">The office decides. Its bank executes.</span><button type="button" data-a="about">About this prototype</button></footer>';
}
function fileHeading(active='review') {
 const file=f(); const s=M.status(file);
 return '<div class="crumb"><button data-a="home" type="button">Files</button>'+icon('chevron')+'<span>'+e(file.reference)+'</span></div>'+
 '<div class="page-heading"><div><h1 class="serif" tabindex="-1">'+e(file.address)+'</h1><p>'+e(file.seller)+'<span class="meta-dot">·</span>Seller proceeds<span class="meta-dot">·</span>Domestic USD</p></div>'+badge(file)+'</div>'+
 '<nav class="view-tabs" aria-label="File views">'+[['review','Review'],['file','Closing file'],['activity','Activity']].map(([id,label])=>'<button type="button" class="'+(active===id?'active':'')+'" data-a="view-'+id+'"'+(active===id?' aria-current="page"':'')+'>'+label+(id==='file'?'<span class="tab-number">'+(file.sources.length+file.records.filter(r=>file.deliveries[r.id]?.status==='placed').length)+'</span>':'')+'</button>').join('')+'<div class="tab-actions"><button type="button" data-a="scope">Scope & handoff</button><button type="button" data-a="file-actions" aria-label="More file actions">'+icon('more')+'</button></div></nav>';
}
function progress() {
 const file=f(), rec=M.currentRecord(file), done=rec&&file.deliveries[rec.id]?.status==='placed';
 const current=!file.prepared?0:rec?2:1;
 return '<div class="progress" aria-label="Receiving review progress">'+['Preparation','Your review','Closing file'].map((text,i)=> (i?icon('chevron'):'')+'<span class="step '+(done||i<current?'done':i===current?'current':'')+'"><span class="step-num">'+(done||i<current?icon('check'):i+1)+'</span>'+text+'</span>').join('')+'</div>';
}
function docRow(src, extra='') {
 return '<button type="button" class="doc-row" data-a="source" data-id="'+e(src.id)+'"><span class="file-icon">'+icon('file')+'</span><div class="grow"><span class="doc-title">'+e(src.title)+'</span><p>'+e(src.type==='office'?'Prior office record · sample':src.origin.startsWith('Seller')?'Seller-supplied · sample':'Sample source document')+'</p></div><span class="right">'+e(extra||'Edition '+src.edition)+'</span>'+icon('chevron')+'</button>';
}
function renderEntry() {
 const file=f();
 return progress()+'<div class="entry-grid"><section><div class="section-title"><h2 style="font-size:20px">Already in this file</h2><span class="small muted">3 documents</span></div><div class="documents">'+file.sources.map(s=>docRow(s)).join('')+'</div><div class="scope-line"><span>'+icon('folder')+' '+e(file.reference)+' / Receiving instructions</span><button class="text-link" data-a="scope">View the sample scope</button></div></section><section class="prepare-box"><h2>Prepare the receiving review.</h2><p>Start with what the office already has. Veto puts the relevant details and their sources together for Maya.</p><div class="mini-steps"><div>'+icon('file')+'Prepare the existing material</div><div>'+icon('user')+'Keep the office’s decision with Maya</div><div>'+icon('folder')+'Return the review to this closing file</div></div>'+btn('Prepare this review','prepare',{kind:'primary',full:true,end:'arrow'})+'<p class="small muted" style="margin:15px 0 0">'+(M.material(file)?'This example has sufficient material. It should not need another request.':'This example has a cropped account page. Prepare it to see the focused follow-up.')+'</p></section></div>';
}
function paper(src) {
 const lines=src.body.split('\n'); let first=true;
 return '<div class="document-paper">'+lines.map((line,i)=>{
   if (first && line) { first=false; return '<div class="paper-title">'+e(line)+'</div><div class="paper-subtitle">Original sample source · retained as supplied</div>'; }
   const cls=line.includes('FICTIONAL SPECIMEN')?'specimen':line.includes('[outside')?'marked problem':/^(Seller \/ account holder:|Account holder:|Account reference:)/.test(line)?'marked':'';
   return '<div class="source-line '+cls+'">'+(line?e(line):'&nbsp;')+'</div>';
 }).join('')+'</div>';
}
function selectedSource() {
 const file=f(); if (ui.sourceId) { const s=file.sources.find(x=>x.id===ui.sourceId); if(s) return s; }
 const q=M.openQuestions(file).find(x=>x.status==='returned');
 if(q) {const rr=q.responses.filter(x=>x.usable).at(-1); if(rr)return file.sources.find(x=>x.id===rr.sourceId);}
 return !M.material(file)?file.sources.find(x=>x.type==='account'):file.sources.find(x=>x.type==='instruction');
}
function sourcePanel() {
 const file=f(), src=selectedSource(), idx=file.sources.indexOf(src);
 return '<section class="source-panel" aria-label="Source document"><div class="source-toolbar">'+icon('file')+'<select id="source-select" aria-label="Choose source document">'+file.sources.map(s=>'<option value="'+e(s.id)+'"'+(s.id===src.id?' selected':'')+'>'+e(s.title)+'</option>').join('')+'</select><button type="button" class="icon-btn" data-a="source" data-id="'+e(src.id)+'" aria-label="Open full original source">'+icon('expand')+'</button></div><div class="source-viewport">'+paper(src)+'</div><div class="source-foot"><div class="row"><span>Source '+(idx+1)+' of '+file.sources.length+' · edition '+src.edition+'</span><button class="text-link" data-a="source" data-id="'+e(src.id)+'">Open original</button></div><p>'+e(src.origin)+'</p></div></section>';
}
function facts(file, inst=file.instruction) {
 return '<dl class="facts">'+[
  ['Account holder',inst.name],['Bank',inst.bank],['Account reference',ui.showFull?inst.account:'•••• '+inst.account.slice(-4)],['Account type',inst.type],['Instruction','Edition '+inst.version+' · receiving only']
 ].map(([label,val])=>'<div class="fact"><dt>'+e(label)+'</dt><dd>'+e(val)+(label==='Account reference'?'<button class="text-link" type="button" data-a="toggle-details">'+(ui.showFull?'Hide':'Show sample details')+'</button>':'')+'</dd></div>').join('')+(ui.showFull?'<div class="fact"><dt>Routing reference</dt><dd class="mono">'+e(inst.routing)+'</dd></div>':'')+'</dl>';
}
function evidenceRows() {
 const file=f(); const mat=M.material(file); const rows=[
  ['Receiving details','Prepared from the seller’s source',file.sources.find(x=>x.type==='instruction').id],
  ['Account page',mat?'Seller-supplied · not independent verification':'Account-holder line is cropped', (mat||file.sources.find(x=>x.type==='account')).id],
  ['Existing office check','Retained in the file · fictional prior check',file.sources.find(x=>x.type==='office').id]
 ];
 return '<div class="evidence-list">'+rows.map(([t,d,id])=>'<button type="button" class="evidence-item" data-a="select-source" data-id="'+e(id)+'">'+icon('file')+'<span><strong>'+t+'</strong><p>'+e(d)+'</p></span><span class="right">View '+icon('chevron')+'</span></button>').join('')+'</div>';
}
function privateNote() {
 if (!['maya','alex'].includes(ui.actor)) return '';
 const draft=f().drafts[ui.actor];
 return '<details class="private-note"'+(draft?.text?' open':'')+'><summary>Private working note'+(draft?.text?(draft.committedReview?' · retained':' · saved draft'):'')+'</summary><label class="sr-only" for="private-note">Private working note for '+e(actorName())+'</label><textarea id="private-note" maxlength="6000" placeholder="For you, not the participant or the issued record.">'+e(draft?.text||'')+'</textarea><div class="button-row"><p id="note-state">'+e(draft?'Saved '+time(draft.at):'Only visible in your demo officer role')+'</p>'+btn('Save private note','save-note',{compact:true})+'</div></details>';
}
function roleNotice() {
 const file=f(); if(ui.actor===file.assigned) return '';
 if(file.proposedOwner===ui.actor) return '<div class="notice"><div class="grow"><strong>You have been offered this review.</strong><p>'+e(M.person(file.assigned,file))+' remains responsible until you accept the task. Acceptance does not approve the evidence.</p></div>'+btn('Accept coverage','accept-coverage',{kind:'primary',compact:true})+'</div>';
 return '<div class="notice">'+icon('user')+'<div><strong>'+e(M.person(file.assigned,file))+' owns this review.</strong><p>You can inspect the material, but cannot make that person’s decision. Use the demo role selector to return to the assigned officer.</p></div></div>';
}
function reviewContent() {
 const file=f(), s=M.status(file), q=M.openQuestions(file)[0], mat=M.material(file);
 if(!file.prepared) return renderEntry();
 if(file.change) return changeView();
 if(file.pendingReceipt) return unknownView();
 const rec=M.currentRecord(file);
 if(rec) return completeView(rec);
 let title='Review the receiving instructions.', intro='The existing material is prepared. No additional request is needed.', summary='', actions='';
 if(q?.status==='returned') {
   title='The requested page is ready for review.'; intro='The new copy includes the previously missing account-holder line. Decide whether it answers your original question.';
   summary='<div class="question-box"><h3>Your original question · edition '+q.edition+'</h3><p>'+e(q.text)+'</p></div><div class="responsibility"><span class="avatar">'+M.PEOPLE[file.assigned].initials+'</span><div><strong>'+e(M.person(file.assigned,file))+' · reviewer</strong><p>Receipt and preparation are complete. Your determination is still needed.</p></div></div>';
   actions=btn('Accept this response','accept-response',{kind:'primary',id:q.id,disabled:!canDecide(),end:'arrow'})+btn('Ask for something else','ask-again',{id:q.id,disabled:!canDecide()});
 } else if(q) {
   title='Veto is carrying the follow-up.'; intro=q.lastIssue || 'You asked the question. Jordan will handle the agreed pursuit and bring back the material for your review.';
   summary='<div class="question-box"><h3>Requested from '+e(file.seller)+'</h3><p>'+e(q.text)+'</p></div><div class="responsibility"><span class="avatar">JL</span><div><strong>Jordan Lee · Veto service owner</strong><p>'+e(checkpoint())+' · through the sample participant link</p></div></div><div class="subtle-panel"><p>The same request is waiting in the seller view. No email has actually been sent.</p></div>';
   actions=btn('Open seller’s task','open-seller',{kind:'primary',end:'arrow'})+btn('See Veto’s follow-up','open-service');
 } else if(!mat) {
   title='One page needs a clearer copy.'; intro='The account reference is visible, but the account-holder name is outside the crop. Ask only for the missing page.';
   summary=facts(file)+'<div class="note">A cropped account page is not enough to inspect who the account belongs to. The source remains available on the right.</div>';
   actions=btn('Request the complete page','request',{kind:'primary',disabled:!canDecide(),end:'arrow'})+btn('Record a hold','hold',{disabled:!canDecide()});
 } else {
   summary=facts(file)+evidenceRows();
   actions=btn('Record review','decision',{kind:'primary',disabled:!canDecide()||!!M.blocking(file),end:'arrow'})+btn('Ask a question','request',{disabled:!canDecide()});
 }
 const resolved=file.questions.filter(x=>x.status==='resolved');
 let holds=M.openHolds(file).map(h=>'<div class="notice warn">'+icon('warning')+'<div class="grow"><strong>Open hold</strong><p>'+e(h.reason)+'</p><div style="margin-top:9px">'+btn('Resolve this hold','resolve-hold',{id:h.id,compact:true,disabled:!canDecide()})+'</div></div></div>').join('');
 const pause=file.paused?'<div class="notice warn">'+icon('pause')+'<div class="grow"><strong>The review remains paused.</strong><p>'+e(file.paused.reason)+'</p></div>'+btn('Resume','resume',{compact:true,disabled:!canDecide()})+'</div>':'';
 const help=file.help.some(h=>h.status==='requested')?'<div class="notice">'+icon('help')+'<div class="grow"><strong>Veto is arranging help.</strong><p>The seller’s obstacle belongs to Jordan now, not to a waiting seller.</p></div>'+btn('Open help','open-service',{compact:true})+'</div>':'';
 return roleNotice()+pause+help+holds+'<div class="review-layout"><section class="review-summary"><h2>'+title+'</h2><p class="intro">'+e(intro)+'</p>'+summary+'</section>'+sourcePanel()+'<section class="review-decision">'+(resolved.length&&!q?'<div class="resolved-line">'+icon('check')+'<span>The office accepted the returned page. The receiving review is still a separate act.</span></div>':'')+'<div class="decision-actions"><div class="button-row">'+actions+'</div><p class="small">'+(q?.status==='returned'?'Accepting the response closes this question only. It does not authorize a payment.':q?'No need to draft a second message or keep checking an inbox. This prototype advances when you act in the other role.':'This review concerns the receiving arrangement, not an amount-specific payment or a bank transfer.')+'</p></div>'+privateNote()+'</section></div>';
}
function completeView(rec) {
 const file=f(), delivery=file.deliveries[rec.id], done=delivery.status==='placed';
 const reports=file.reports.filter(r=>!r.transferred).map(reportCard).join('');
 return progress()+reports+'<div class="success-layout"><section class="success-main"><div class="success-symbol">'+icon(done?'check':'folder')+'</div><h2>'+ (done?'Back in the closing file.':'The review is saved. Filing is not finished.')+'</h2><p class="intro">'+(done?e(M.person(rec.decision.actor,file))+'’s receiving review and its sources are together in '+e(file.reference)+'. The office can continue without rebuilding the review.':'The office’s decision is intact. Veto still owns returning this edition to the agreed destination. Retry delivery, not the review.')+'</p><div class="record-tile"><span class="file-icon">'+icon('file')+'</span><div class="grow"><h3>Receiving Review Record</h3><p>Edition '+rec.edition+' · '+e(M.person(rec.decision.actor,file))+' · '+stamp(rec.createdAt)+'</p></div><span class="badge '+(done?'good':'warn')+'">'+(done?'Filed':'Not filed')+'</span></div><div class="button-row">'+(done?btn('View the filed record','record',{kind:'primary',id:rec.id,icon:'file'})+btn('Open closing file','view-file',{icon:'folder'}):btn('Retry filing','retry-delivery',{kind:'primary',id:rec.id,icon:'refresh'})+btn('Inspect saved record','record',{id:rec.id}))+'</div><div class="receipt-lines"><div class="receipt-line">'+icon('check')+'<div><strong>Office review saved</strong><p>'+e(M.person(rec.decision.actor,file))+' · instruction '+rec.instruction.version+' · material basis '+rec.basis+'</p></div></div><div class="receipt-line">'+icon(done?'check':'clock')+'<div><strong>'+(done?'Exact edition placed at the agreed destination':'Closing-file placement still needed')+'</strong><p>'+e(file.service.endpoint)+(done?' · '+e(delivery.placement.id):' · owned by Jordan Lee')+'</p></div></div><div class="receipt-line">'+icon('arrow')+'<div><strong>The office and bank keep their next decisions</strong><p>Amount-specific authorization, bank submission, execution, and receipt are not established by this record.</p></div></div></div></section><aside class="boundary-aside"><h3>This is receiving-review completion.</h3><p>The placement above is in the prototype’s sample closing file. It demonstrates the handoff, not a live integration.</p><h3>After the handoff</h3><p>'+e(file.service.observation==='open'?'Sample observation is still open. Relevant late reports create new, owned work without rewriting this record.':'Sample observation has ended. New reports go through the named office-transfer route; no renewed review is implied.')+'</p>'+btn('Try a late report','late-report',{compact:true,disabled:!done})+'<div style="margin-top:16px">'+btn('Try a destination change','simulate-change',{compact:true,disabled:!!file.change})+'</div><div class="source-refs"><p>These are optional diagnostic paths. An ordinary sufficient review ends without extra ceremony.</p><button class="text-link" data-a="scope">See the sample responsibility boundary</button></div></aside></div>';
}
function unknownView() {
 const file=f(); return progress()+'<div class="notice warn">'+icon('warning')+'<div><strong>The save response was lost.</strong><p>The original operation may already be saved. Do not create another decision.</p></div></div><div class="success-layout"><section><h2>Check the original review.</h2><p class="muted block-space">The prototype simulated a lost response after storage. The correct recovery is to reconcile the same operation, then continue filing once its status is known.</p><dl class="facts block-space"><div class="fact"><dt>Operation</dt><dd class="mono">'+e(file.pendingReceipt.operationId)+'</dd></div><div class="fact"><dt>Next actor</dt><dd>'+e(M.person(file.assigned,file))+'</dd></div></dl>'+btn('Check saved review','reconcile',{kind:'primary',disabled:!canDecide(),icon:'refresh'})+'</section><aside class="boundary-aside"><h3>No repeat decision</h3><p>Your source material and office act remain tied to the same operation. A retry must not create a second act.</p></aside></div>';
}
function reportCard(r) {
 const file=f(); return '<section class="report-card"><h3>New report about an already filed review</h3><p>'+e(r.text)+'</p><small>Linked to '+e(r.recordId)+' · received '+stamp(r.at)+' · sample observation '+e(r.observationAtReceipt)+' at receipt</small>'+(!r.warningPlaced?btn('Place warning in closing file','warn-report',{id:r.id,kind:'primary',compact:true,disabled:!['jordan',file.assigned].includes(ui.actor)}):'<p class="small">The warning is placed beside the unchanged historical record. The office must still accept this new work.</p>'+btn('Accept the follow-up','accept-report',{id:r.id,kind:'primary',compact:true,disabled:!canDecide()}))+'</section>';
}
function changeView() {
 const file=f(), c=file.change;
 return '<div class="notice warn">'+icon('warning')+'<div><strong>The earlier instruction was withdrawn.</strong><p>Its review does not carry over. Rejecting the replacement would not restore the withdrawn instruction.</p></div></div><div class="success-layout"><section><h2>'+(c.transferred?'The office owns the change.':'A new destination needs office handling.')+'</h2><p class="muted block-space">This report is a proposal, not an accepted replacement. Changed-destination review is outside the first sample undertaking.</p><div class="change-grid"><div class="change-card"><h3>Earlier instruction · withdrawn</h3><strong>'+e(c.old.bank)+'</strong><p class="mono">'+e(c.old.account)+'</p><p>Edition '+c.old.version+' · retained as history</p></div><div class="change-card new"><h3>Proposed replacement · not reviewed</h3><strong>'+e(c.proposal.bank)+'</strong><p class="mono">'+e(c.proposal.account)+'</p><p>No inherited review or approval</p></div></div>'+(c.transferred?'<div class="notice good">'+icon('check')+'<div><strong>'+e(M.person(c.acceptedBy,file))+' accepted the separate office task.</strong><p>'+e(c.nextAction)+'</p></div></div>':roleNotice()+btn('Accept changed-destination handling','transfer-change',{kind:'primary',disabled:!canDecide(),end:'arrow'}))+'<div class="button-row block-space">'+btn('Inspect original sources','view-file',{icon:'file'})+btn('View history','view-activity')+'</div></section><aside class="boundary-aside"><h3>Preserved, not overwritten</h3><p>The original source documents and every issued review remain unchanged. No new bank details have been activated.</p><h3>The transfer has a boundary</h3><p>The office applies its own change procedure. This prototype contains no bank connection and cannot stop a transfer.</p>'+btn('Restart this example','restart',{compact:true})+'</aside></div>';
}
function renderClosingFile() {
 const file=f(), placed=file.records.filter(r=>file.deliveries[r.id]?.status==='placed');
 return fileHeading('file')+'<div class="section-title"><div><h2 style="font-size:22px">Receiving instructions</h2><p>'+e(file.reference)+' · the agreed sample destination</p></div>'+btn('Back to review','view-review',{compact:true,icon:'left'})+'</div><p class="small muted" style="margin-bottom:24px">This is a local stand-in for the office’s normal closing file. Nothing is connected to an external escrow system.</p>'+
 (file.change?'<div class="notice warn">'+icon('warning')+'<div><strong>A change report affects the earlier instruction.</strong><p>Historical records remain below. They are not current approval for the proposed replacement.</p></div></div>':'')+
 file.reports.filter(r=>r.warningPlaced).map(r=>'<div class="report-card"><h3>Linked late-report notice</h3><p>'+e(r.text)+'</p><small>Historical record '+e(r.recordId)+' is unchanged. '+(r.transferred?'Follow-up accepted by '+e(M.person(r.owner,file))+'.':'Follow-up is not yet accepted by the office.')+'</small></div>').join('')+
 (placed.length?'<h3 style="margin-bottom:15px">Filed reviews</h3><div class="documents">'+placed.map(r=>'<button class="doc-row" data-a="record" data-id="'+e(r.id)+'"><span class="file-icon">'+icon('file')+'</span><div class="grow"><span class="doc-title">Receiving Review Record · edition '+r.edition+'</span><p>'+e(M.person(r.decision.actor,file))+' · '+stamp(r.createdAt)+' · '+e(r.id)+'</p></div><span class="badge good">Filed</span>'+icon('chevron')+'</button>').join('')+'</div><div class="block-space"></div>':'<div class="subtle-panel" style="margin-bottom:26px"><p>No review has been filed yet. Exporting a draft would not complete the agreed handoff.</p></div>')+
 '<h3 style="margin-bottom:16px">Retained source documents</h3><div class="documents">'+file.sources.map(s=>docRow(s,s.complete&&s.relevant?'Original retained':!s.relevant?'Different file':'Cropped copy')).join('')+'</div>'+privateNote();
}
function renderActivity() {
 const file=f(); return fileHeading('activity')+'<div class="section-title"><h2 style="font-size:22px">What happened on this file</h2><span class="small muted">Local demo events</span></div><div class="timeline">'+[...file.events].reverse().map(ev=>'<article class="timeline-item"><span class="timeline-dot">'+icon('check')+'</span><div><time>'+stamp(ev.at)+' · '+e(M.person(ev.actor,file))+'</time><h3>'+e(ev.title)+'</h3><p>'+e(ev.detail)+'</p></div></article>').join('')+'</div>';
}
function renderList() {
 let files=state.cases.filter(file=>ui.filter==='all'||ui.filter==='drafts'?(ui.filter==='drafts'?!!file.drafts[ui.actor]?.text && !file.drafts[ui.actor]?.committedReview:true):M.status(file).group===ui.filter);
 if(ui.query) files=files.filter(file=>(file.address+' '+file.reference+' '+file.seller).toLowerCase().includes(ui.query.toLowerCase()));
 const active=state.cases.filter(x=>M.status(x).group==='active').length, complete=state.cases.length-active;

     '<p class="intro">You are accepting responsibility for the next office action. You are not approving a new destination or directing the bank.</p><label class="field-label" for="next-action">What will the office do next?</label><textarea id="next-action" name="reason" required maxlength="3000">'+(type==='transfer-change'?'Use the office’s established change procedure to obtain and review a properly supported replacement. Do not rely on the withdrawn instruction.':'Contact the relevant person through the office’s established route, assess the report, and handle any affected payment under the office and bank procedures.')+'</textarea><p class="small muted block-space">This transfer does not silently purchase new preparation or add a fee. Earlier records remain unchanged.</p>',type==='transfer-change'?'transfer-change-form':'accept-report-form','Accept the next action');
 } else if(type==='late-report') {
   html=formDialog('Try a relevant late report','Diagnostic scenario · no real report is sent.','<p class="intro">The historical handoff stays complete. This report creates a separate obligation linked to that issued edition.</p><label class="field-label" for="report-text">Sample report</label><textarea id="report-text" name="text" maxlength="3000" required>The seller reports a possible issue with the receiving account after the review was filed. The office needs to assess the report before relying further on those details.</textarea><p class="small muted block-space">Current sample observation: '+e(file.service.observation)+'. Jordan triages; the office must accept the subsequent task.</p>','late-report-form','Add the sample report');
 } else if(type==='record') {
   const rec=file.records.find(r=>r.id===context.id); if(!rec){showError('This issued record could not be found.');return;}
   wide=true;
   html=simpleDialog('Review Record · edition '+rec.edition,'Fixed issued snapshot · '+rec.id,recordMarkup(rec),btn('Structured JSON','download-json',{id:rec.id,compact:true})+btn('Download record','download-record',{id:rec.id,icon:'download',compact:true})+btn('Print / Save PDF','print-record',{id:rec.id,kind:'primary',icon:'print',compact:true}));
 } else if(type==='scope') {
   html=simpleDialog('The sample undertaking','Demonstration settings, not customer terms.',
     '<h3>Prepare this receiving review</h3><p class="intro block-space">One individual seller’s domestic USD receiving arrangement. Use the three sample sources, the office’s prior procedure, and the assigned reviewer. All admission fields are stipulated for the demonstration.</p><dl class="facts"><div class="fact"><dt>Office decision</dt><dd>'+e(M.person(file.assigned,file))+'</dd></div><div class="fact"><dt>Veto owner</dt><dd>Jordan Lee</dd></div><div class="fact"><dt>Return destination</dt><dd>'+e(file.service.endpoint)+'</dd></div><div class="fact"><dt>Endpoint</dt><dd>Simulated exact-edition placement in the sample closing file</dd></div><div class="fact"><dt>Observation</dt><dd>'+e(file.service.observation==='open'?'Open until ended in demo controls':'Ended in this sample')+'</dd></div><div class="fact"><dt>Late-report route</dt><dd>Jordan prepares a warning; the assigned officer accepts the follow-up.</dd></div></dl><h3>The boundaries do not disappear</h3><p class="intro block-space">A changed destination does not inherit the earlier review. Its handling transfers to the office outside this initial undertaking. This prototype does not decide entitlement, authorize an unspecified payment, move money, provide insurance, or verify a bank account.</p><h3>The checkpoint is a fixture</h3><p class="intro block-space">The demo uses a 30-minute illustrative checkpoint, advanced only by your actions. It is not an adopted response-time promise. Nothing is monitored after you close this page. Buyer funding is outside this focused prototype, not removed from Veto’s existing commitments.</p>');
 } else if(type==='about') {
   html=simpleDialog('A complete local experience','Prepare → review → return to the closing file.',
    '<p class="intro">Start with 108 Olive Avenue for the ordinary sufficient file. Use 62 Alder Court for the missing-page loop. Change roles to follow the same request as the seller, Veto’s helper, and the covering officer.</p><h3>What works here</h3><p class="intro block-space">Retained sources, targeted questions, partial and wrong-file replies, delivered help, reviewer decisions, private notes, accepted coverage, holds and pauses, record creation, simulated filing and recovery, late reports, and local exports all use connected state.</p><h3>What is simulated</h3><p class="intro block-space">Every identity, document, contact, bank reference, check, message, and destination is fictional. Preparation uses explicit fixtures, not an AI or document-reading API. Role switching is a demo affordance, not access control. Local browser storage is not a secure financial system.</p><h3>Data handling</h3><p class="intro block-space">The app has no network calls or external dependencies. It stores only this prototype’s data under one browser-storage key when permitted. Do not put live client data here. Restart clears only this demo’s sample state.</p><div class="source-refs"><p>Based on <em>Veto — First Feature Analysis</em>, pp. 8–18; <em>Product Foundations v10</em>, pp. 3–5, 13–15, 31, 37–40, and 45–49.</p><p>New fixture choices, sample names, and screen implementation are prototype design, not observations about actual customers.</p></div>');
 } else if(type==='controls') {
   html=simpleDialog('Try the connected experience','Controls change only this local fictional prototype.',
     '<div class="demo-control-group"><h3>Start with a file</h3><p>The ordinary file needs no additional request. The other file needs one readable page.</p><div class="button-row">'+btn('108 Olive Avenue','ordinary',{compact:true})+btn('62 Alder Court','question-case',{compact:true})+'</div></div>'+
     '<div class="demo-control-group"><h3>Test recovery</h3><p>Each option affects the next review save or filing only. Then continue the ordinary review.</p><div class="button-row">'+btn('Fail the next review save','fault-save',{compact:true})+btn('Lose the next save response','fault-unknown',{compact:true})+btn('Fail the next filing','fault-delivery',{compact:true})+'</div><p style="margin-top:10px">Armed: '+e([faults.save==='fail'?'review save failure':faults.save==='unknown'?'lost save response':'',faults.delivery?'filing failure':''].filter(Boolean).join(', ')||'none')+'</p></div>'+
     '<div class="demo-control-group"><h3>Test change and duration</h3><p>Preserve the prior record while creating new, owned work. The current file is '+e(file.reference)+'.</p><div class="button-row">'+btn('Report a changed destination','simulate-change',{compact:true,disabled:!file.prepared||!!file.change})+btn('Add a late report','late-report',{compact:true,disabled:!M.historicalComplete(file)})+btn('End sample observation','end-observation',{compact:true,disabled:file.service.observation==='ended'||!['jordan',file.assigned].includes(ui.actor)})+'</div></div>'+
     '<div class="demo-control-group"><h3>Reset the sample</h3><p>This removes only the selected file’s demo progress. The other example is preserved.</p>'+btn('Restart this example','restart',{compact:true,icon:'refresh'})+'</div><p class="demo-controls-note">'+e(sessionOnly?'Browser storage is not available in this viewer. All work is session-only.':'Progress is local to this browser; no data is sent to a server.')+'</p>');
 } else if(type==='file-actions') {
   html=simpleDialog('Actions on this review',file.reference,
    '<div class="stack">'+btn(file.paused?'Resume the review':'Pause the review',file.paused?'resume':'pause',{disabled:!canDecide()})+btn('Arrange officer coverage','coverage',{disabled:!canDecide()})+btn('Record a separate hold','hold',{disabled:!canDecide()||!file.prepared})+btn('Open the seller’s view','open-seller')+btn('Open Veto’s service view','open-service')+btn('View sample scope','scope')+'</div>');
 } else if(type==='restart') {
   html=simpleDialog('Restart this example?','Only '+file.reference+' will be reset.','<p>The local questions, notes, reviews, and sample history for this example will be removed. The other file and your source application are untouched.</p>',btn('Keep my progress','close-dialog')+btn('Restart example','confirm-restart',{kind:'primary',icon:'refresh'}));
 }
 d.className=wide?'wide':''; d.innerHTML=html;
 if(!d.open)d.showModal(); d.scrollTop=0;
 const focus=d.querySelector('textarea, input:not([type=checkbox]):not([type=radio]), select, .dialog-footer .btn, .icon-btn');
 if(focus)focus.focus({preventScroll:true});
}
function saveNote(quiet=false) {
 const input=$('#private-note'); if(!input)return true;
 const text=input.value;
 const success=commit({type:'NOTE',text},{quiet:true});
 if(success) {ui.noteDirty=false; const label=$('#note-state'); if(label)label.textContent=saveCopy()+' · '+time(new Date().toISOString()); if(!quiet)notify(saveCopy()+'. Private note retained.');}
 return success;
}
function finishFiling(fileId, recordId) {
 const target=M.file(state,fileId); if(target.pendingReceipt)return;
 const fail=faults.delivery; faults.delivery=false;
 const ok=commit({type:'DELIVER',fileId,recordId,actor:'system',fail});
 if(ok)notify(fail?'Review saved. Filing failed; Veto still owns delivery.':'Review saved and placed in the sample closing file.',fail);
}
function getQuestion() {return M.openQuestions(f())[0];}
function handleAction(action, element) {
 const file=f(), id=element?.dataset?.id;
 if (ui.noteDirty && !['save-note','dismiss-toast'].includes(action) && !saveNote(true)) return;
 switch(action) {
  case 'dismiss-toast': $('#toast').hidden=true; return;
  case 'clear-error': ui.error=''; render(); return;
  case 'close-dialog': closeDialog(); return;
  case 'home': navigate('list',ui.fileId,ui.actor==='seller'?'maya':ui.actor); return;
  case 'view-review': navigate('review'); return;
  case 'view-file': navigate('file'); return;
  case 'view-activity': navigate('activity'); return;
  case 'open-file': navigate('review',id,ui.actor==='seller'?'maya':ui.actor); return;
  case 'ordinary': navigate('review','ESC-1042','maya'); return;
  case 'question-case': navigate('review','ESC-1043','maya'); return;
  case 'open-seller': navigate('seller',ui.fileId,'seller'); return;
  case 'open-service': navigate('service',ui.fileId,'jordan'); return;
  case 'open-officer': navigate('review',ui.fileId,file.assigned); return;
  case 'filter': ui.filter=id; render(); return;
  case 'controls': case 'about': case 'scope': case 'file-actions': case 'restart': case 'pause': case 'hold': case 'coverage': case 'request': case 'decision': case 'help-request': case 'late-report': case 'transfer-change':
   if(ui.noteDirty&&!saveNote(true))return; dialog(action); return;
  case 'source': case 'record': case 'ask-again': case 'resolve-hold': case 'help-reply': case 'accept-report':
   if(ui.noteDirty&&!saveNote(true))return; dialog(action,{id}); return;
  case 'select-source': if(ui.noteDirty&&!saveNote(true))return; ui.sourceId=id; render(); $('.source-panel')?.scrollIntoView({block:'nearest',behavior:'auto'}); return;
  case 'toggle-details': if(ui.noteDirty&&!saveNote(true))return; ui.showFull=!ui.showFull; render(); if (ui.modal==='decision' && $('#dialog .facts')) $('#dialog .facts').outerHTML=facts(file); return;
  case 'save-note': saveNote(); return;
  case 'prepare': {
    if(!commit({type:'PREPARE'}))return;
    ui.preparing=true; render(); const fid=file.id;
    setTimeout(()=>{ui.preparing=false;render();if(ui.fileId===fid)$('#announcer').textContent='The sample review is ready.';},750); return;
  }
  case 'accept-response': {
    if(commit({type:'ACCEPT_RESPONSE',questionId:id})){ui.sourceId=null; render(); notify('Response accepted by the office. The receiving review is a separate act.');} return;
  }
  case 'submit-page': {
    const q=getQuestion(); if(!q){showError('There is no open request to submit to.');return;}
    if(commit({type:'SUBMIT_PAGE',questionId:q.id,edition:q.edition,kind:file.participantDraft.selection,attested:file.participantDraft.attested})){
      render(); window.scrollTo(0,0); notify(saveCopy()+'. Your page is with the office.');
    } return;
  }
  case 'assisted':
    if(commit({type:'PARTICIPANT_DRAFT',draft:{selection:'assisted',attested:false}})) {closeDialog();render(); $('.attachment-preview')?.scrollIntoView({block:'start'});notify('Read the accessible sample before submitting it yourself.');} return;
  case 'auto-reply': {
    const q=getQuestion(); if(q&&commit({type:'AUTO_REPLY',questionId:q.id}))notify('Automatic reply received. The question stays open.'); return;
  }
  case 'resume': if(commit({type:'RESUME'})){closeDialog();render();notify('Review resumed. Incoming material and earlier work were preserved.');} return;
  case 'accept-coverage': if(commit({type:'ACCEPT_COVERAGE'})){render();notify('You accepted the review task, not the evidence.');} return;
  case 'reconcile':
    if(commit({type:'RECONCILE'})){const rec=M.currentRecord(f());if(rec)finishFiling(file.id,rec.id);} return;
  case 'retry-delivery': if(!file.pendingReceipt)finishFiling(file.id,id); return;
  case 'fault-save': faults.save='fail';closeDialog();notify('The next review save will fail once. Continue the ordinary review.');return;
  case 'fault-unknown': faults.save='unknown';closeDialog();notify('The next review’s save response will be lost once.');return;
  case 'fault-delivery': faults.delivery=true;closeDialog();notify('The next closing-file placement will fail once.');return;
  case 'simulate-change':
    closeDialog(); if(commit({type:'CHANGE',actor:'seller'})){ui.sourceId=null; if(ui.actor==='seller'||ui.actor==='jordan')navigate('review',file.id,file.assigned);else render();notify('Change reported. The earlier instruction is not restored or reused.');} return;
  case 'end-observation':
    if(commit({type:'END_OBSERVATION'})){closeDialog();render();notify('Sample observation ended. Relevant late reports still have an office-transfer route.');} return;
  case 'warn-report': if(commit({type:'WARN_REPORT',reportId:id})){notify('Warning placed beside the unchanged historical record. Office acceptance remains.');}return;
  case 'confirm-restart': {
    const next=M.clone(state), fresh=M.initial().cases.find(x=>x.id===file.id); next.cases=next.cases.map(x=>x.id===file.id?fresh:x);next.rev+=1;
    try{storage.write(next);state=next;faults.save=null;faults.delivery=false;ui.noteDirty=false;closeDialog();navigate('review',file.id,'maya');notify('This sample was restarted. The other file is unchanged.');}catch(err){showError('The sample could not be reset. No reset was acknowledged.');}return;
  }
  case 'download-source': {
    const src=file.sources.find(s=>s.id===id); if(!src||(ui.actor==='seller'&&src.type==='office'))return;
    download(file.id+'-'+src.id+'.txt',src.body);notify('Source text exported. No review or delivery status changed.');return;
  }
  case 'download-record': case 'download-json': case 'print-record': {
    const rec=file.records.find(r=>r.id===id);if(!rec)return;
    if(action==='download-record') {download('Veto-'+file.id+'-Review-Edition-'+rec.edition+'.html',exportHTML(rec),'text/html;charset=utf-8');notify('Record exported. Export alone does not establish closing-file delivery.');}
    else if(action==='download-json') {download('Veto-'+file.id+'-Review-Edition-'+rec.edition+'.json',JSON.stringify({record:rec,deliveryReceipt:file.deliveries[rec.id],formatVersion:1},null,2),'application/json');notify('Exact record and separate delivery receipt exported.');}
    else {
      const w=window.open('','_blank');
      if(!w){showError('Your browser blocked the print window. Use Download record, open that HTML file, then Print / Save as PDF.');return;}
      w.opener=null; w.document.write(exportHTML(rec));w.document.close();
      setTimeout(()=>{try{w.focus();w.print();}catch(err){notify('Use Print / Save as PDF in the opened record.');}},250);
    }return;
  }
 }
}
document.addEventListener('click',ev=>{
 const button=ev.target.closest('[data-a]');if(!button||button.disabled)return;
 ev.preventDefault();handleAction(button.dataset.a,button);
});
document.addEventListener('change',ev=>{
 const el=ev.target;
 if(el.id==='actor-select') {
   if(ui.noteDirty&&!saveNote(true)){render();return;}
   const actor=el.value; navigate(actor==='seller'?'seller':actor==='jordan'?'service':'review',ui.fileId,actor);
 } else if(el.id==='source-select') {if(ui.noteDirty&&!saveNote(true))return; ui.sourceId=el.value;render();$('#source-select')?.focus({preventScroll:true});}
 else if(el.name==='sample-page') {commit({type:'PARTICIPANT_DRAFT',draft:{selection:el.value,attested:false}});}
 else if(el.id==='participant-attest') {commit({type:'PARTICIPANT_DRAFT',draft:{attested:el.checked}},{quiet:true});}
});
document.addEventListener('input',ev=>{
 if(ev.target.id==='private-note') {ui.noteDirty=true;const label=$('#note-state');if(label)label.textContent='Not yet saved';}
 if(ev.target.id==='file-search') {const pos=ev.target.selectionStart;ui.query=ev.target.value;render();const input=$('#file-search');input.focus();input.setSelectionRange(pos,pos);}
});
document.addEventListener('submit',ev=>{
 ev.preventDefault();const form=ev.target, data=new FormData(form), type=form.id;const c=ui.modalContext,file=f(); let ok=false;
 if(type==='decision-form') {
   if(c.basis!==file.basis){showError('The material changed while the review was open. Close this dialog and inspect the current basis.');return;}
   if(data.get('outcome')==='hold') {
     if(!String(data.get('reason')||'').trim()){showError('Explain the material question before recording a hold.');return;}
     ok=commit({type:'HOLD',reason:data.get('reason')});
     if(ok){closeDialog();render();notify('A separate hold was saved. No affirmative review was issued.');}return;
   }
   if(data.get('outcome')!=='supported'){showError('Choose your determination. Nothing is preselected.');return;}
   ok=commit({type:'DECIDE',basis:c.basis,inspected:data.get('inspected')==='on',reason:data.get('reason'),operationId:'review-'+file.id+'-'+(state.seq+1)});
   if(ok){closeDialog();ui.noteDirty=false;render();if(f().pendingReceipt)notify('Save response lost. Check the original review before continuing.',true);else{const rec=M.currentRecord(f());finishFiling(file.id,rec.id);}}return;
 }
 if(type==='request-form')ok=commit({type:'REQUEST',text:data.get('text')});
 else if(type==='ask-again-form')ok=commit({type:'ASK_AGAIN',questionId:c.id,text:data.get('text')});
 else if(type==='help-form')ok=commit({type:'HELP',questionId:getQuestion()?.id,text:data.get('text')});
 else if(type==='help-reply-form')ok=commit({type:'DELIVER_HELP',helpId:c.id,questionId:getQuestion()?.id,text:data.get('text'),assisted:data.get('assisted')==='on'});
 else if(type==='pause-form')ok=commit({type:'PAUSE',reason:data.get('reason')});
 else if(type==='hold-form')ok=commit({type:'HOLD',reason:data.get('reason')});
 else if(type==='resolve-hold-form')ok=commit({type:'RESOLVE_HOLD',holdId:c.id,sourceId:data.get('sourceId'),reason:data.get('reason')});
 else if(type==='coverage-form')ok=commit({type:'OFFER_COVERAGE',next:data.get('next')});
 else if(type==='transfer-change-form')ok=commit({type:'TRANSFER_CHANGE',reason:data.get('reason')});
 else if(type==='late-report-form')ok=commit({type:'LATE_REPORT',text:data.get('text')});
 else if(type==='accept-report-form')ok=commit({type:'ACCEPT_REPORT',reportId:c.id,reason:data.get('reason')});
 if(ok){closeDialog();render();notify(type==='request-form'?'Veto accepted the follow-up. Open the seller’s task to continue.':type==='help-reply-form'?'Your answer is now visible in the seller’s task.':type==='help-form'?'Jordan has your obstacle. Veto owns the next action.':type==='coverage-form'?'Coverage offered. Switch to the other officer to accept.':saveCopy()+'. The next action has been updated.');}
});
$('#dialog').addEventListener('cancel',ev=>{ev.preventDefault();closeDialog();});
window.addEventListener('hashchange',()=>{parseHash();render();});
window.addEventListener('storage',ev=>{
 if(ev.key!==KEY||!ev.newValue)return;
 try{const next=JSON.parse(ev.newValue);if(next.schema!==1||next.rev<=state.rev)return;
 const dirty=$('#private-note')?.value; state=next;render();
 if(ui.noteDirty&&$('#private-note')){$('#private-note').value=dirty;$('#note-state').textContent='Local draft not yet saved';}
 if($('#dialog').open)showError('Another tab changed this file. Your open form is retained; inspect the current basis before committing.');
 else notify('This file was updated in another tab. Current views have been refreshed.');
 }catch(err){showError('Another tab supplied unreadable demo state. The current view was not replaced.');}
});
window.addEventListener('beforeunload',ev=>{if(ui.noteDirty){const saved=saveNote(true);if(!saved){ev.preventDefault();ev.returnValue='';}}});
parseHash();render();
if(bootWarning)$('#announcer').textContent=bootWarning;
window.VetoPrototype=Object.freeze({version:'1.0.0',snapshot:()=>M.clone(state),storageMode:()=>sessionOnly?'session':'browser-local',exportRecord:id=>{const rec=state.cases.flatMap(x=>x.records).find(r=>r.id===id);return rec?M.clone(rec):null;}});
})();
</script></body></html>
