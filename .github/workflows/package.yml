name: Package source release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch encrypted handoff
        run: |
          curl -L --fail --retry 3 --retry-delay 2 \
            -o Veto-Website-History-2026-09-22-local.zip.enc \
            https://github.com/TryVeto/veto-codex/releases/download/chatgpt-transfer-20260922-1510/Veto-Website-History-2026-09-22-local.zip.enc
          echo "9adb03a14a416a6c5fd6bf9c490f014d682143312e3ee0f16e1f8b120079327c  Veto-Website-History-2026-09-22-local.zip.enc" | sha256sum -c -
      - uses: actions/upload-artifact@v7
        with:
          name: veto-website-history-encrypted
          path: Veto-Website-History-2026-09-22-local.zip.enc
          retention-days: 1
          compression-level: 0
